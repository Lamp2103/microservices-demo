name: Build and Deploy to EKS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  EKS_CLUSTER: observability-demo-cluster

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - frontend
          - cartservice
          - checkoutservice
          - productcatalogservice
          - shippingservice
          - paymentservice
          - emailservice
          - recommendationservice
          - currencyservice
          - adservice
          - loadgenerator

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SERVICE: ${{ matrix.service }}
          TAG: ${{ github.sha }}
        run: |
          docker build \
          
            -t "$REGISTRY/online-boutique/$SERVICE:$TAG" \
            "./src/$SERVICE"

          docker push \
            "$REGISTRY/online-boutique/$SERVICE:$TAG"