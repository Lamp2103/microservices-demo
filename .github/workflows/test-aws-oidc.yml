name: Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-aws:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            )

            console.log("aud =", payload.aud)
            console.log("sub =", payload.sub)
            console.log("repository =", payload.repository)
            console.log("repository_id =", payload.repository_id)
            console.log("repository_owner =", payload.repository_owner)
            console.log("repository_owner_id =", payload.repository_owner_id)
            console.log("ref =", payload.ref)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify EKS access
        run: |
          aws eks describe-cluster \
            --name observability-demo-cluster \
            --region ap-southeast-1 \
            --query 'cluster.status'

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-southeast-1 \
            --name observability-demo-cluster

      - name: Test kubectl
        run: |
          kubectl get nodes