name: Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-aws:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            )
            console.log(JSON.stringify({
              aud: payload.aud,
              sub: payload.sub,
              repository: payload.repository,
              repository_id: payload.repository_id,
              repository_owner: payload.repository_owner,
              repository_owner_id: payload.repository_owner_id,
              ref: payload.ref
            }, null, 2))

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify EKS access
        run: |
          aws eks describe-cluster \
            --name observability-demo-cluster \
            --region ap-southeast-1 \
            --query 'cluster.status'

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-southeast-1 \
            --name observability-demo-cluster

      - name: Test kubectl
        run: |
          kubectl get nodes

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR
        run: |
          aws ecr describe-repositories \
            --region ap-southeast-1 \
            --query 'repositories[?starts_with(repositoryName, `online-boutique/`)].repositoryName'

      - name: Build frontend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t "$REGISTRY/online-boutique/frontend:${GITHUB_SHA}" \
            ./src/frontend

      - name: Push frontend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            "$REGISTRY/online-boutique/frontend:${GITHUB_SHA}"

      - name: Verify Kubernetes permissions
        run: |
          kubectl get nodes
          kubectl get namespace
          kubectl get pods -n online-boutique