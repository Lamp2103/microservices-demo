name: Continuous Integration (CI) - Build & Push to ECR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Phát hiện thư mục microservice nào có thay đổi code
  changes:
    name: Detect Changed Microservices
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend: 'src/frontend/**'
            checkoutservice: 'src/checkoutservice/**'
            cartservice: 'src/cartservice/**'
            productcatalogservice: 'src/productcatalogservice/**'
            shippingservice: 'src/shippingservice/**'
            paymentservice: 'src/paymentservice/**'
            emailservice: 'src/emailservice/**'
            recommendationservice: 'src/recommendationservice/**'
            currencyservice: 'src/currencyservice/**'
            adservice: 'src/adservice/**'

  build-and-push:
    name: Build & Push Docker Images
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Nếu 1 service bị build lỗi, các service còn lại vẫn tiếp tục build
      max-parallel: 4    # Giới hạn chạy tối đa 4 build song song để không quá tải network/GHA runner
      matrix:
        include:
          - service: frontend
            context: ./src/frontend
            dockerfile: ./src/frontend/Dockerfile
          - service: cartservice
            context: ./src/cartservice/src
            dockerfile: ./src/cartservice/src/Dockerfile
          - service: checkoutservice
            context: ./src/checkoutservice
            dockerfile: ./src/checkoutservice/Dockerfile
          - service: productcatalogservice
            context: ./src/productcatalogservice
            dockerfile: ./src/productcatalogservice/Dockerfile
          - service: shippingservice
            context: ./src/shippingservice
            dockerfile: ./src/shippingservice/Dockerfile
          - service: paymentservice
            context: ./src/paymentservice
            dockerfile: ./src/paymentservice/Dockerfile
          - service: emailservice
            context: ./src/emailservice
            dockerfile: ./src/emailservice/Dockerfile
          - service: recommendationservice
            context: ./src/recommendationservice
            dockerfile: ./src/recommendationservice/Dockerfile
          - service: currencyservice
            context: ./src/currencyservice
            dockerfile: ./src/currencyservice/Dockerfile
          - service: adservice
            context: ./src/adservice
            dockerfile: ./src/adservice/Dockerfile

    steps:
      # 1. Lấy mã nguồn từ GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Khởi tạo Docker Buildx (bắt buộc để kích hoạt tính năng Caching gha)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Xác thực với AWS bằng GitHub Secrets đã cài đặt ở Ngày 1
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 4. Đăng nhập vào Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Build Docker Image và Push lên ECR kèm Docker Layer Caching
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/${{ matrix.service }}
          file: ./src/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/online-boutique/${{ matrix.service }}:latest
            ${{ steps.login-ecr.outputs.registry }}/online-boutique/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Continuous Deployment (CD) to K8s
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 1. Lấy mã nguồn (chứa các file K8s Manifests / Helm Charts)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Xác thực với AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Đăng nhập ECR để lấy URI Registry
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Thiết lập kết nối kubectl tới cụm Kubernetes (AWS EKS)
      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

      # 5. Cập nhật Image Tag mới (${{ github.sha }}) vào Kubernetes Deployments
      - name: Deploy / Update Manifests in K8s
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          COMMIT_SHA="${{ github.sha }}"
          NAMESPACE="online-boutique"

          # 1. Tự động tạo Namespace nếu chưa tồn tại
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

          # 2. Apply toàn bộ Manifests K8s gốc
          kubectl apply -f ./release/kubernetes-manifests.yaml -n $NAMESPACE

          # 3. Cập nhật Image Tag mới từ ECR cho các Deployments
          SERVICES=(
            "frontend"
            "checkoutservice"
            "cartservice"
            "productcatalogservice"
            "shippingservice"
            "paymentservice"
            "emailservice"
            "recommendationservice"
            "currencyservice"
            "adservice"
          )

          for SERVICE in "${SERVICES[@]}"; do
            echo "Updating $SERVICE deployment with image tag: $COMMIT_SHA"
            kubectl set image deployment/$SERVICE server=$REGISTRY/online-boutique/$SERVICE:$COMMIT_SHA -n $NAMESPACE
          done

      # 6. Kiểm tra trạng thái Rollout của các Deployments
      - name: Verify Deployment Rollout Status
        run: |
          NAMESPACE="online-boutique"
          kubectl rollout status deployment/frontend -n $NAMESPACE --timeout=120s
          kubectl rollout status deployment/checkoutservice -n $NAMESPACE --timeout=120s