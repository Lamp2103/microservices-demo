# Cấu hình chế độ chạy đơn lẻ (SingleBinary) cho môi trường Lab/Test
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem

# Giới hạn tài nguyên CPU/RAM cho Loki Single Binary
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Bổ sung để tắt scaleable
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Tắt các dịch vụ mở rộng không cần thiết để tiết kiệm tài nguyên
chunksCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false