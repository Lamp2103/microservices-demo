apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
  namespace: online-boutique
spec:
  replicas: 2 # Duy trì ít nhất 2 replicas
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%        # Tạo thêm tối đa 25% Pods phiên bản mới trước khi xóa Pods cũ
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      serviceAccountName: frontend
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: frontend
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8080
          # [CẬP NHẬT] Readiness Probe: Quyết định khi nào Pod sẵn sàng nhận traffic
          readinessProbe:
            initialDelaySeconds: 10
            periodSeconds: 5        # Tần suất kiểm tra: 5s/lần
            timeoutSeconds: 2       # Chờ phản hồi tối đa 2s, quá 2s coi như fail
            successThreshold: 1     # Chỉ cần 1 lần thành công là cho phép nhận traffic
            failureThreshold: 3     # Phải fail 3 lần liên tiếp mới ngắt traffic
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-readiness-probe"
          # [CẬP NHẬT] Liveness Probe: Quyết định khi nào Pod bị treo và cần restart
          livenessProbe:
            initialDelaySeconds: 15 # Cho thời gian khởi động lâu hơn Readiness một chút tránh bị kill oan
            periodSeconds: 10       # Tần suất kiểm tra: 10s/lần
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3     # Phải fail 3 lần liên tiếp mới tiến hành restart Pod
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-liveness-probe"     
          env:
          - name: PORT
            value: "8080"
          - name: PRODUCT_CATALOG_SERVICE_ADDR
            value: "productcatalogservice:3550"
          - name: CURRENCY_SERVICE_ADDR
            value: "currencyservice:7000"
          - name: CART_SERVICE_ADDR
            value: "cartservice:7070"
          - name: RECOMMENDATION_SERVICE_ADDR
            value: "recommendationservice:8080"
          - name: SHIPPING_SERVICE_ADDR
            value: "shippingservice:50051"
          - name: CHECKOUT_SERVICE_ADDR
            value: "checkoutservice:5050"
          - name: AD_SERVICE_ADDR
            value: "adservice:9555"
          - name: SHOPPING_ASSISTANT_SERVICE_ADDR
            value: "shoppingassistantservice:80"
          - name: ENABLE_PROFILER
            value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-external
  labels:
    app: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend