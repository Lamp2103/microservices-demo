apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
  labels:
    app: adservice
  namespace: online-boutique
spec:
  replicas: 2 # Duy trì ít nhất 2 replicas
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%        # Tạo thêm tối đa 25% Pods phiên bản mới trước khi xóa Pods cũ
      maxUnavailable: 0
  selector:
    matchLabels:
      app: adservice
  template:
    metadata:
      labels:
        app: adservice
    spec:
      serviceAccountName: adservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: adservice
        ports:
        - containerPort: 9555
        env:
        - name: PORT
          value: "9555"
        resources:
          requests:
            cpu: 200m
            memory: 180Mi
          limits:
            cpu: 300m
            memory: 300Mi
        startupProbe:
          grpc:
            port: 9555
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 12   # Cho phép ứng dụng có tối đa 70s (10 + 5*12) để khởi động hoàn tất
          
        readinessProbe:
          grpc:
            port: 9555
          initialDelaySeconds: 5 # Đã có startupProbe bảo vệ, có thể rút ngắn delay của readiness
          periodSeconds: 5       # Kiểm tra với tần suất cao hơn (5s) để đưa Pod vào nhận traffic ngay khi sẵn sàng
          timeoutSeconds: 3      # K8s sẽ đánh dấu thất bại nếu không nhận được phản hồi sau 3s
          successThreshold: 1
          failureThreshold: 3
          
        livenessProbe:
          grpc:
            port: 9555
          initialDelaySeconds: 5
          periodSeconds: 10      # Liveness không cần check quá dày như Readiness
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: adservice
  labels:
    app: adservice
spec:
  type: ClusterIP
  selector:
    app: adservice
  ports:
  - name: grpc
    port: 9555
    targetPort: 9555
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adservice
