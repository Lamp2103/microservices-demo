apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  tempo.yaml: |-
    apiVersion: 1

    datasources:
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.monitoring:3200
        isDefault: false

        jsonData:
          httpMethod: GET

          serviceMap:
            datasourceUid: prometheus

          tracesToMetrics:
            datasourceUid: prometheus

          nodeGraph:
            enabled: true