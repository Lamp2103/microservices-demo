apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: test-alert
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: test
      rules:
        - alert: TestTelegramAlert
          expr: vector(1)
          for: 10s
          labels:
            severity: critical
          annotations:
            summary: "Test Telegram Alert"
            description: "This is a test alert from Kubernetes."