apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring

data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20

      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.namespace.name
            - k8s.node.name
            - k8s.deployment.name

      transform/service_name:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["k8s.deployment.name"] != nil and IsMatch(attributes["service.name"], "^unknown_service")

      batch:
        send_batch_size: 8192
        timeout: 200ms

    exporters:
      otlp/tempo:
        endpoint: tempo.monitoring.svc.cluster.local:4317
        tls:
          insecure: true

      prometheus:
        endpoint: 0.0.0.0:8889

      debug:
        verbosity: detailed

    connectors:
      servicegraph:
        dimensions:
          - http.method
          - http.status_code
        metrics_flush_interval: 10s

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors:
            - memory_limiter
            - k8sattributes
            - transform/service_name
            - batch
          exporters:
            - otlp/tempo
            - debug
            - servicegraph

        metrics:
          receivers:
            - otlp
            - servicegraph
          processors:
            - memory_limiter
            - k8sattributes
            - batch
          exporters:
            - prometheus
            - debug